name: risk-theory

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  api:
    image: ${API_IMAGE:?set API_IMAGE to an immutable full commit SHA tag}
    pull_policy: always
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/readiness', timeout=8)"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s
    logging: *bounded-logging
    networks:
      private: {}
      edge:
        aliases: [risk-theory-api]

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE to an immutable full commit SHA tag}
    pull_policy: always
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_SITE_URL: https://risk-theory.bluehour.cloud
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 30s
    logging: *bounded-logging
    networks:
      private: {}
      edge:
        aliases: [risk-theory-web]

networks:
  private:
    name: risk-theory-private
    internal: true
  edge:
    name: vala-edge
    external: true
