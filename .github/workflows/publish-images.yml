name: Validate and publish container images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: true

env:
  API_IMAGE: ghcr.io/soroushtaheri/risk-dashboard-api
  WEB_IMAGE: ghcr.io/soroushtaheri/risk-dashboard-web

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend types
        run: npm exec tsc -- --noEmit

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.lock

      - name: Generate and reconcile backend data
        run: python scripts/generate_companion_data.py

      - name: Test backend
        run: python -m pytest

  publish:
    name: Publish ${{ matrix.name }} image
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            dockerfile: Dockerfile.api
            image: ghcr.io/soroushtaheri/risk-dashboard-api
            cache_scope: risk-dashboard-api
          - name: web
            dockerfile: Dockerfile.web
            image: ghcr.io/soroushtaheri/risk-dashboard-web
            cache_scope: risk-dashboard-web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
